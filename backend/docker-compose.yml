services:
  db:
    build:
      context: .devcontainer/db
      dockerfile: Dockerfile # Postgres
    # image: mongo:latest # MongoDB
    restart: unless-stopped
    ports:
      - 3011:5432
      # - 3011:27017 # MongoDB
    volumes:
      - db-data:/var/lib/postgresql/data # Postgres
      # - db-data-mongo:/data/db # MongoDB
    environment:
      # Postgres environment variables
      POSTGRES_PASSWORD: zapal
      POSTGRES_USER: zapal
      POSTGRES_DB: zapal

      # MongoDB environment variables
      MONGO_INITDB_ROOT_USERNAME: zapal
      MONGO_INITDB_ROOT_PASSWORD: zapal
      MONGO_INITDB_DATABASE: zapal

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - 3030:9001 # Web UI
      - 3031:9000
    volumes:
      - s3-storage:/data
    environment:
      MINIO_ROOT_USER: zapalAdmin
      MINIO_ROOT_PASSWORD: zapal!123
    command: server --console-address ":9001" /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy # Чекаємо, поки storage запуститься
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://storage:9000 zapalAdmin 'zapal!123';
      mc mb myminio/dev-bucket --ignore-existing;
      mc anonymous set download myminio/dev-bucket;
      exit 0;
      "

  mail:
    image: maildev/maildev:latest
    restart: unless-stopped
    ports:
      - 3040:1080 # Web UI
      - 1025:1025

volumes:
  data:
  db-data:
  s3-storage:
